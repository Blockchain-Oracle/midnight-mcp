<svg width="900" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="beforeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fde68a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="afterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#86efac;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:1" />
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#3b82f6" />
    </marker>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-size="28" font-weight="700" fill="#1f2937" font-family="Arial, sans-serif">
    Path Alias Migration
  </text>
  <line x1="200" y1="60" x2="700" y2="60" stroke="#e5e7eb" stroke-width="2"/>

  <!-- BEFORE Section -->
  <rect x="50" y="90" width="380" height="270" fill="#fffbeb" rx="8"/>
  <rect x="50" y="90" width="380" height="50" fill="url(#beforeGrad)" rx="8"/>
  <text x="240" y="123" text-anchor="middle" font-size="20" font-weight="600" fill="#78350f" font-family="Arial, sans-serif">
    Before: Relative Imports
  </text>

  <!-- Code Examples - Before -->
  <g filter="url(#shadow)">
    <rect x="70" y="165" width="340" height="45" fill="#ffffff" stroke="#fbbf24" stroke-width="2" rx="6"/>
    <text x="85" y="193" font-size="13" fill="#78350f" font-family="Courier, monospace">
      import { loadConfig } from
    </text>
    <text x="85" y="203" font-size="13" fill="#b45309" font-family="Courier, monospace" font-weight="600">
      '../../src/lib/config/env.js'
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="225" width="340" height="45" fill="#ffffff" stroke="#fbbf24" stroke-width="2" rx="6"/>
    <text x="85" y="253" font-size="13" fill="#78350f" font-family="Courier, monospace">
      import { WalletService } from
    </text>
    <text x="85" y="263" font-size="13" fill="#b45309" font-family="Courier, monospace" font-weight="600">
      '../../../src/services/wallet.js'
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="285" width="340" height="45" fill="#ffffff" stroke="#fbbf24" stroke-width="2" rx="6"/>
    <text x="85" y="313" font-size="13" fill="#78350f" font-family="Courier, monospace">
      import { MCPServer } from
    </text>
    <text x="85" y="323" font-size="13" fill="#b45309" font-family="Courier, monospace" font-weight="600">
      '../../src/mcp/mcp-server.js'
    </text>
  </g>

  <!-- Arrow -->
  <line x1="440" y1="225" x2="460" y2="225" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- AFTER Section -->
  <rect x="470" y="90" width="380" height="270" fill="#f0fdf4" rx="8"/>
  <rect x="470" y="90" width="380" height="50" fill="url(#afterGrad)" rx="8"/>
  <text x="660" y="123" text-anchor="middle" font-size="20" font-weight="600" fill="#14532d" font-family="Arial, sans-serif">
    After: Path Aliases ✓
  </text>

  <!-- Code Examples - After -->
  <g filter="url(#shadow)">
    <rect x="490" y="165" width="340" height="45" fill="#ffffff" stroke="#22c55e" stroke-width="2" rx="6"/>
    <text x="505" y="193" font-size="13" fill="#14532d" font-family="Courier, monospace">
      import { loadConfig } from
    </text>
    <text x="505" y="203" font-size="13" fill="#15803d" font-family="Courier, monospace" font-weight="600">
      '@lib/config/env.js'
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect x="490" y="225" width="340" height="45" fill="#ffffff" stroke="#22c55e" stroke-width="2" rx="6"/>
    <text x="505" y="253" font-size="13" fill="#14532d" font-family="Courier, monospace">
      import { WalletService } from
    </text>
    <text x="505" y="263" font-size="13" fill="#15803d" font-family="Courier, monospace" font-weight="600">
      '@services/wallet.js'
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect x="490" y="285" width="340" height="45" fill="#ffffff" stroke="#22c55e" stroke-width="2" rx="6"/>
    <text x="505" y="313" font-size="13" fill="#14532d" font-family="Courier, monospace">
      import { MCPServer } from
    </text>
    <text x="505" y="323" font-size="13" fill="#15803d" font-family="Courier, monospace" font-weight="600">
      '@mcp/mcp-server.js'
    </text>
  </g>

  <!-- Benefits -->
  <rect x="50" y="375" width="800" height="15" fill="#dbeafe" rx="4"/>
  <text x="450" y="387" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af" font-family="Arial, sans-serif">
    ✓ Easier refactoring   ✓ Better IDE autocomplete   ✓ Consistent import paths   ✓ tsconfig.json path mappings
  </text>
</svg>
