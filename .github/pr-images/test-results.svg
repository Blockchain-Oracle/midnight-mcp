<svg width="700" height="350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="passGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#86efac;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="350" y="40" text-anchor="middle" font-size="28" font-weight="700" fill="#1f2937" font-family="Arial, sans-serif">
    Test Suite Results
  </text>
  <line x1="150" y1="60" x2="550" y2="60" stroke="#e5e7eb" stroke-width="2"/>

  <!-- Main Result Card -->
  <g filter="url(#shadow)">
    <rect x="150" y="100" width="400" height="180" fill="url(#passGrad)" rx="12"/>

    <!-- Big Number -->
    <text x="350" y="180" text-anchor="middle" font-size="80" font-weight="700" fill="#ffffff" font-family="Arial, sans-serif">
      609
    </text>

    <!-- Pass Label -->
    <text x="350" y="220" text-anchor="middle" font-size="24" font-weight="600" fill="#ffffff" font-family="Arial, sans-serif">
      TESTS PASSING
    </text>

    <!-- Checkmark -->
    <circle cx="500" cy="140" r="30" fill="#14532d" opacity="0.3"/>
    <path d="M 488 140 L 497 149 L 512 131" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Stats -->
  <rect x="50" y="300" width="600" height="35" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" rx="6"/>

  <text x="100" y="323" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d" font-family="Arial, sans-serif">
    23 Suites
  </text>
  <line x1="150" y1="305" x2="150" y2="330" stroke="#86efac" stroke-width="1"/>

  <text x="250" y="323" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d" font-family="Arial, sans-serif">
    100% Pass Rate
  </text>
  <line x1="325" y1="305" x2="325" y2="330" stroke="#86efac" stroke-width="1"/>

  <text x="450" y="323" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d" font-family="Arial, sans-serif">
    0 Failures
  </text>
  <line x1="525" y1="305" x2="525" y2="330" stroke="#86efac" stroke-width="1"/>

  <text x="600" y="323" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d" font-family="Arial, sans-serif">
    0 Skipped
  </text>
</svg>
